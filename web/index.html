<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>AIO Calender MK2</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('aio-theme');
          if (theme !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        background-color: #0a0a0c;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        overflow-x: hidden;
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-y;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        background-color: #0a0a0c;
      }
      html:not(.dark), html:not(.dark) body, html:not(.dark) #root {
        background-color: #f9fafb;
      }
      .overflow-x-auto {
        touch-action: auto;
      }
      input, textarea, select {
        user-select: text;
        -webkit-user-select: text;
      }
      img {
        -webkit-user-drag: none;
        user-drag: none;
      }
    </style>
    <meta name="description" content="All-in-One student schedule, academic timetable, and task deadline manager with real-time cloud sync." />
    <meta property="og:title" content="AIO Calender MK2" />
    <meta name="apple-mobile-web-app-title" content="AIO Calender MK2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:description" content="All-in-One student schedule, academic timetable, and task deadline manager with real-time cloud sync." />
    <meta name="google-signin-client_id" content="20006102155-572mn31v7pjgi64lr17ba6ag7qrhgo0s.apps.googleusercontent.com" />
    <meta name="google-signin-scope" content="profile email" />
    <script>
      try {
        if (typeof window !== 'undefined' && window.location && window.location.hostname === 'aio-calander-mk2.vercel.app') {
          window.location.replace('https://aio-calender-mk2.vercel.app' + window.location.pathname + window.location.search);
        }
      } catch (e) {
        console.warn('Domain redirect check notice:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
